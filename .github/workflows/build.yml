name: Build and Send Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
          zlib1g-dev libffi-dev libssl-dev build-essential ccache \
          libc6:i386 libstdc++6:i386 libncurses5:i386 libtinfo5:i386
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer virtualenv

    - name: Setup Android SDK and Accept Licenses
      run: |
        mkdir -p /home/runner/.android
        keytool -genkey -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        
        # تحميل وتثبيت أداة sdkmanager وقبول الرخص تلقائياً لتجنب مشكلة التوقف
        export ANDROID_HOME="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $ANDROID_HOME/cmdline-tools
        
        # تثبيت الـ command-line tools وقبول الرخص لجميع الحزم لضمان توفر aidl
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv $ANDROID_HOME/cmdline-tools/bin $ANDROID_HOME/cmdline-tools/latest/
        mv $ANDROID_HOME/cmdline-tools/lib $ANDROID_HOME/cmdline-tools/latest/
        
        # الموافقة على رخص SDK وتثبيت الأدوات المطلوبة مسبقاً
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true

    - name: Clear conflicting Android Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
        echo "ANDROID_NDK=" >> $GITHUB_ENV

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Send APK to Telegram
      run: |
        APK_FILE=$(ls bin/*.apk | head -n 1)
        echo "Found APK: $APK_FILE"
        curl -F document=@"$APK_FILE" \
             -F caption="إليك ملف الـ APK الخاص بك جاهز للتحميل والتشغيل!" \
             "https://api.telegram.org/bot8508402230:AAGK5iP1fxc7Dscu5pDmqWkAGLCCYLtKrB0/sendDocument?chat_id=8897834377"
             
